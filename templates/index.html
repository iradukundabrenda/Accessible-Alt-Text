<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alt Text Generator</title>
</head>
<body>
  <h1>Alt Text Generator</h1>

  <!-- Form where users enter an image URL -->
  <form action="/generate" method="post">

    <!-- Label for the input box -->
    <label for="image_url">Enter Image URL:</label>

    <!-- Text input field named 'image_url' -->
    <input type="text" id="image_url" name="image_url" required />

    <!-- Submit button -->
    <button type="submit">Generate Alt Text</button>

  </form>
</body>
</html>
